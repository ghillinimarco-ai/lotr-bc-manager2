<script>
/* Intro: aspetta la schermata audio dell'app (che dà il "tocco" necessario), poi parte con l'audio scelto dall'utente */
(function(){
var box=document.getElementById('intro'),v=document.getElementById('introVid'),snd=document.getElementById('introSound');
var done=false,started=false,seen=false,cap=null,wd=null,waited=0;
function end(){if(done)return;done=true;clearTimeout(cap);clearTimeout(wd);try{v.pause();}catch(e){}box.style.opacity='0';box.style.pointerEvents='none';setTimeout(function(){try{box.remove();}catch(e){}},650);}
function bc(){return window.BCAudio||null;}
function wantSound(){var b=bc();try{return b?!b.isMuted():false;}catch(e){return false;}}
function appVol(){var b=bc();try{return b?b.getVolume():0.75;}catch(e){return 0.75;}}
v.addEventListener('ended',end);
v.addEventListener('error',end);
v.addEventListener('loadedmetadata',function(){if(started&&isFinite(v.duration)){clearTimeout(cap);cap=setTimeout(end,v.duration*1000+2500);}});
v.addEventListener('playing',function(){seen=true;clearTimeout(wd);if(isFinite(v.duration)){clearTimeout(cap);cap=setTimeout(end,v.duration*1000+2500);}});
function mutedFallback(){
  v.muted=true;
  if(wantSound())snd.style.display='block';
  var q=v.play();if(q&&q.catch)q.catch(end);
}
function begin(){
  if(started||done)return;started=true;
  v.muted=!wantSound();
  try{v.volume=appVol();}catch(e){}
  var p=v.play();
  if(p&&p.catch)p.catch(function(){if(!v.muted)mutedFallback();else end();});
  wd=setTimeout(function(){if(!seen)end();},4000);   /* se il video non parte entro 4s, apri l'app */
  cap=setTimeout(end,25000);                          /* limite massimo */
}
document.getElementById('introSkip').addEventListener('click',function(e){e.stopPropagation();end();});
box.addEventListener('click',function(){
  if(v.muted&&wantSound()){try{v.muted=false;v.volume=appVol();snd.style.display='none';if(v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});}}catch(e){}}
});
var iv=setInterval(function(){
  if(done){clearInterval(iv);return;}
  var gate=document.getElementById('bcAudioGate');
  if(document.readyState==='complete'&&!gate){
    waited+=150;
    if(!started&&waited>=300){clearInterval(iv);begin();}
  }else{waited=0;}
},150);
})();
</script>

<script>
/* ===== Musica di sottofondo: usa interruttore e volume "Musica" gia' presenti nel menu ⋮ dell'app ===== */
(function(){
var NAMES=['Brano (1).mp3','Brano (2).mp3','Brano (3).mp3'];
var BASES=['music/',''];               /* cerca prima in www/music/, poi in www/ */
var a=document.createElement('audio');
a.id='bgMusic';a.preload='auto';a.setAttribute('playsinline','');a.volume=0.75;
var i=0,bi=0,gb=0,tried=0,fails=0,dead=false;
function attach(){if(!a.parentNode&&document.body)document.body.appendChild(a);}
function introOn(){return !!document.getElementById('intro');}
function bc(){return window.BCAudio||null;}
function silent(){var b=bc();try{return b?b.isMuted():false;}catch(e){return false;}}
function want(){return !dead&&!introOn()&&!silent()&&!document.hidden;}
function src(){return BASES[bi]+encodeURIComponent(NAMES[i]);}
function load(n){i=((n%NAMES.length)+NAMES.length)%NAMES.length;bi=gb;tried=0;a.src=src();}
function tick(){
  attach();
  if(want()){if(a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){});}}
  else if(!a.paused){a.pause();}
}
a.addEventListener('playing',function(){gb=bi;tried=0;fails=0;});
a.addEventListener('ended',function(){load(i+1);tick();});
a.addEventListener('error',function(){
  if(++tried<BASES.length){bi=(bi+1)%BASES.length;a.src=src();tick();}
  else if(++fails<=NAMES.length){load(i+1);tick();}
  else{dead=true;}
});
function later(){setTimeout(tick,60);setTimeout(tick,450);}
document.addEventListener('bc:audio-state',later);
document.addEventListener('bc:audio-ready',later);
document.addEventListener('visibilitychange',tick);
['pointerup','click','touchend'].forEach(function(ev){document.addEventListener(ev,tick,{passive:true});});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',attach);else attach();
load(Math.floor(Math.random()*NAMES.length));
setInterval(tick,800);
})();
</script>
