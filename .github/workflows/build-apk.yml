name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa dipendenze
        run: npm install

      - name: Crea progetto Android
        run: |
          npx cap add android
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read dens L F <<< "$d"
            convert icon-only.png -resize ${L}x${L} $RES/mipmap-$dens/ic_launcher.png
            convert icon-only.png -resize ${L}x${L} $RES/mipmap-$dens/ic_launcher_round.png
            convert icon-only.png -resize ${F}x${F} $RES/mipmap-$dens/ic_launcher_foreground.png
          done
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0d1620</color></resources>' > $RES/values/ic_launcher_background.xml
          npx cap sync android

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salva APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOTR-Roster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LOTR Roster v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
